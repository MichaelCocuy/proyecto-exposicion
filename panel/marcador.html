<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>💣 Marcador</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0d0f12; color: #e7ecf2; font: 16px system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
    button { font: 600 15px system-ui; padding: 10px 18px; border-radius: 10px; border: 0; cursor: pointer; background: #ff3b30; color: #fff; }
    .equipos { display: grid; gap: 12px; padding: 0 12px 12px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
    iframe { width: 100%; height: 100%; min-height: 560px; border: 0; border-radius: 16px; background: #0d0f12; }
    #mensaje { color: #ffcc00; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Agente vs. desarrolladores</h1>
    <span id="mensaje" role="status"></span>
    <button id="iniciar">Iniciar todas</button>
  </header>
  <section class="equipos" id="equipos"></section>
  <script>
    // Uso: /marcador?e=Agente@http://localhost:3000&e=Desarrolladores@http://localhost:3001
    const params = new URLSearchParams(location.search).getAll('e');
    const equipos = (params.length ? params : ['Agente@http://localhost:3000', 'Desarrolladores@http://localhost:3001'])
      .map((e) => { const [nombre, ...url] = e.split('@'); return { nombre, url: url.join('@').replace(/\/$/, '') }; });
    document.getElementById('equipos').innerHTML = equipos
      .map((e) => `<iframe title="${e.nombre}" src="${e.url}/bomba?compacto&equipo=${encodeURIComponent(e.nombre)}"></iframe>`).join('');
    document.getElementById('iniciar').addEventListener('click', async () => {
      const errores = [];
      await Promise.all(equipos.map(async (e) => {
        try { const r = await fetch(e.url + '/api/iniciar', { method: 'POST' }); if (!r.ok) errores.push(`${e.nombre}: ${(await r.json()).error}`); }
        catch { errores.push(`${e.nombre}: no responde (${e.url})`); }
      }));
      document.getElementById('mensaje').textContent = errores.join(' · ');
    });
  </script>
</body>
</html>
