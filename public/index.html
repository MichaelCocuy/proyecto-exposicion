<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La última cosecha: el crimen de la Hacienda La Esmeralda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#E3E7DB; --superficie:#F1F3EC; --tinta:#1C2A22; --tenue:#4E5E54;
  --cereza:#A3162E; --hoja:#2F5D46; --ambar:#9A6D1E; --linea:rgba(28,42,34,.2);
  --display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --doc:'Courier Prime','Courier New',Courier,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#0E1A14; --superficie:#16261E; --tinta:#E3E8DD; --tenue:#A3B3A8;
    --cereza:#E5566D; --hoja:#86BE9F; --ambar:#E2B65C; --linea:rgba(227,232,221,.16);
  }
}
:root[data-theme="dark"]{
  --papel:#0E1A14; --superficie:#16261E; --tinta:#E3E8DD; --tenue:#A3B3A8;
  --cereza:#E5566D; --hoja:#86BE9F; --ambar:#E2B65C; --linea:rgba(227,232,221,.16);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--papel);color:var(--tinta);font-family:var(--doc);font-size:16px;line-height:1.55}
img,svg,iframe{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cereza);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0 0 .5em}
p{margin:0 0 .9em}

/* Barra superior */
.barra{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.8rem 1.25rem;border-bottom:1px solid var(--linea);position:sticky;top:env(safe-area-inset-top,0px);background:var(--papel);z-index:5}
.barra .marca{font-family:var(--display);font-size:1.35rem;font-style:italic}
.barra .caso{color:var(--cereza);font-weight:700}
.barra .reloj{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.barra .quien{color:var(--tenue)}

/* Distribución */
.tablero{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:0;min-height:calc(100% - 60px)}
nav.mapa{border-right:1px solid var(--linea);padding:1.25rem .75rem}
nav.mapa h2{font-size:1.05rem;margin:0 .5rem .6rem;font-style:italic}
nav.mapa ol{list-style:none;margin:0;padding:0;counter-reset:none}
nav.mapa button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;padding:.5rem .6rem;border-radius:3px;cursor:pointer}
nav.mapa button:hover{background:var(--superficie)}
nav.mapa button[aria-current="page"]{background:var(--tinta);color:var(--papel)}
nav.mapa button:disabled{opacity:.4;cursor:not-allowed}
nav.mapa .visto{font-size:.8rem;color:var(--hoja)}
nav.mapa button[aria-current="page"] .visto{color:var(--papel)}
main{padding:1.75rem clamp(1rem,3vw,2.5rem) 3rem;min-width:0}
aside.libreta{border-left:1px solid var(--linea);padding:1.25rem 1rem;background:var(--superficie)}
@media (max-width:1100px){
  .tablero{grid-template-columns:210px minmax(0,1fr)}
  aside.libreta{grid-column:1 / -1;border-left:0;border-top:1px solid var(--linea)}
}
@media (max-width:720px){
  .tablero{grid-template-columns:minmax(0,1fr)}
  nav.mapa{border-right:0;border-bottom:1px solid var(--linea);padding:.6rem;overflow-x:auto}
  nav.mapa h2{display:none}
  nav.mapa ol{display:flex;gap:.25rem;width:max-content}
  nav.mapa button{white-space:nowrap}
}

/* Documentos y piezas */
.escena-titulo{font-size:clamp(2rem,4vw,3rem);margin-bottom:.2em}
.escena-bajada{color:var(--tenue);max-width:62ch;margin-bottom:1.6rem}
.documento{background:var(--superficie);border:1px solid var(--linea);padding:1.25rem 1.4rem;border-radius:2px;max-width:70ch}
.documento + .documento{margin-top:1rem}
.documento h3{font-size:1.4rem}
.nota{border-left:3px solid var(--ambar);padding:.4rem 0 .4rem 1rem;color:var(--tenue);max-width:65ch;margin:1rem 0}
.boton{background:var(--tinta);color:var(--papel);border:0;padding:.6rem 1.1rem;border-radius:3px;cursor:pointer;font-weight:700}
.boton:hover{background:var(--hoja)}
.boton.secundario{background:none;color:var(--tinta);border:1px solid var(--tinta)}
.boton.secundario:hover{background:var(--tinta);color:var(--papel)}
.boton:disabled{opacity:.45;cursor:not-allowed}
.campo{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1rem}
.campo input,.campo select,.campo textarea{background:var(--papel);border:1px solid var(--linea);border-radius:2px;padding:.55rem .7rem}
.error{color:var(--cereza);font-weight:700;min-height:1.4em}
.tabla-scroll{overflow-x:auto;border:1px solid var(--linea);background:var(--superficie)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:.45rem .8rem;border-bottom:1px solid var(--linea);white-space:nowrap}
th{font-family:var(--display);font-weight:700;font-size:1rem}
td.hora{font-variant-numeric:tabular-nums;font-weight:700}
.filtros{display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem}
.filtros .campo{margin:0;min-width:210px}

/* Portería */
.porteria{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:2.5rem;align-items:start;max-width:1150px}
@media (max-width:900px){.porteria{grid-template-columns:minmax(0,1fr)}}
.portada h1{font-size:clamp(3.2rem,8vw,6.5rem);font-style:italic;letter-spacing:-.02em;margin:.1em 0 .2em}
.portada .lugar{color:var(--tenue)}
.portada .bajada{font-family:var(--display);font-size:1.35rem;max-width:32ch;line-height:1.35}
.sello{display:inline-block;margin-top:1.2rem;border:3px solid var(--cereza);color:var(--cereza);padding:.4rem 1rem;font-weight:700;font-size:1.3rem;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-6deg);animation:sellar .5s cubic-bezier(.2,1.6,.4,1) both .3s}
@keyframes sellar{from{opacity:0;transform:rotate(-6deg) scale(2.2)}to{opacity:1;transform:rotate(-6deg) scale(1)}}
.porteria form{margin-top:1.2rem}
details{margin-top:1.5rem;color:var(--tenue)}
details summary{cursor:pointer}

/* Expediente */
.sospechosos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;margin:1rem 0 2rem}
.ficha{border-top:3px solid var(--tinta);padding-top:.6rem}
.ficha h3{font-size:1.35rem;margin-bottom:.1em}
.ficha .rol{color:var(--cereza);font-size:.9rem;margin-bottom:.4rem}
.listas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.5rem}
.listas ul{padding-left:1.1rem;margin:0}

/* Plano */
.plano{display:grid;grid-template-columns:1fr 70px 1fr;gap:0;max-width:900px;align-items:stretch}
.ala h3{font-size:1.5rem;font-style:italic}
.cuarto{border:1px solid var(--linea);background:var(--superficie);padding:.9rem 1rem;margin-bottom:.8rem}
.cuarto strong{font-family:var(--display);font-size:1.15rem;font-weight:700;display:block}
.corredor{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;color:var(--tenue);border-left:1px dashed var(--linea);border-right:1px dashed var(--linea);margin:2.6rem .6rem .8rem;font-size:.85rem}
@media (max-width:640px){.plano{grid-template-columns:minmax(0,1fr)}.corredor{writing-mode:horizontal-tb;border:0;border-top:1px dashed var(--linea);border-bottom:1px dashed var(--linea);margin:.5rem 0 1rem;padding:.4rem}}

/* Cámara */
.monitor{width:100%;max-width:760px;height:430px;border:10px solid #1b1f1c;border-radius:6px;background:#050805;display:block}

/* Forense */
.barra-progreso{height:12px;background:var(--papel);border:1px solid var(--linea);max-width:420px;margin:.8rem 0}
.barra-progreso span{display:block;height:100%;width:0;background:var(--hoja);transition:width .25s linear}

/* Estudio */
.retratos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.2rem;max-width:760px;margin:1.2rem 0}
.retrato{position:relative;background:none;border:0;padding:0;cursor:help;text-align:center}
.retrato .marco{aspect-ratio:3/4;border:9px solid var(--ambar);outline:1px solid var(--linea);outline-offset:3px;background:var(--superficie);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:2.6rem;font-style:italic;color:var(--tenue)}
.retrato .placa{display:block;margin-top:.5rem;font-size:.9rem}
.tooltip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:230px;background:var(--tinta);color:var(--papel);padding:.6rem .75rem;font-size:.88rem;line-height:1.4;z-index:3;border-radius:2px;text-align:left}
.pista-oculta{display:none}

/* Caja fuerte */
.caja{display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start}
.teclado{background:#23282a;padding:1rem;border-radius:6px;width:250px}
.pantallita{background:#0b2a1c;color:#8ff0b5;font-size:1.8rem;letter-spacing:.4em;text-align:center;padding:.4rem;margin-bottom:.8rem;border-radius:3px;min-height:2.6rem;font-variant-numeric:tabular-nums}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.teclas button{background:#3a4144;color:#f1f1ec;border:0;padding:.7rem 0;border-radius:4px;font-weight:700;cursor:pointer}
.teclas button:hover{background:#51595c}
.teclas .abrir{background:var(--hoja);color:#fff}
.estado-falta{color:var(--cereza);font-weight:700}
.estado-ok{color:var(--hoja)}

/* Contestadora */
.mensajes{list-style:none;padding:0;margin:0;max-width:720px}
.mensajes li{display:flex;gap:1rem;align-items:center;justify-content:space-between;padding:.75rem 0;border-bottom:1px solid var(--linea);flex-wrap:wrap}
.mensajes .hora{font-weight:700;font-variant-numeric:tabular-nums;margin-right:.8rem}
dialog{border:1px solid var(--linea);background:var(--superficie);color:var(--tinta);max-width:min(560px,92vw);padding:1.4rem 1.5rem;border-radius:3px}
dialog::backdrop{background:rgba(5,10,8,.6)}

/* Diario */
.pagina-diario{background:var(--superficie);border:1px solid var(--linea);max-width:62ch;padding:1.6rem 1.8rem;min-height:220px;font-family:var(--display);font-style:italic;font-size:1.25rem;line-height:1.6;background-image:repeating-linear-gradient(transparent 0 38px,var(--linea) 38px 39px)}
.pagina-diario .fecha{font-style:normal;font-family:var(--doc);font-size:.95rem;color:var(--cereza);display:block;margin-bottom:.6rem}
.paginador{display:flex;gap:1rem;align-items:center;margin-top:1rem}

/* Acusación */
.acusacion{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;max-width:760px}
.veredicto{margin-top:1.6rem;max-width:72ch}
.veredicto .grande{font-family:var(--display);font-size:clamp(2.2rem,5vw,3.6rem);font-style:italic;margin:.2em 0}
.veredicto.gano .grande{color:var(--hoja)}
.veredicto.perdio .grande{color:var(--cereza)}
.veredicto ol{padding-left:1.2rem}
.resumen{display:flex;gap:2rem;flex-wrap:wrap;margin:1rem 0}
.resumen div strong{display:block;font-family:var(--display);font-size:1.8rem}

/* Libreta */
.libreta h2{font-size:1.3rem;font-style:italic}
.libreta h3{font-family:var(--doc);font-size:.95rem;font-weight:700;margin:1rem 0 .4rem}
.marcas{display:flex;flex-direction:column;gap:.15rem}
.marcas button{background:none;border:0;text-align:left;padding:.2rem .3rem;cursor:pointer;border-radius:2px;font-size:.9rem}
.marcas button:hover{background:var(--papel)}
.marcas button[aria-pressed="true"]{text-decoration:line-through;text-decoration-color:var(--cereza);text-decoration-thickness:2px;color:var(--tenue)}
.libreta textarea{width:100%;min-height:110px;resize:vertical}
.libreta .acciones{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.libreta .acciones .boton{font-size:.85rem;padding:.45rem .7rem}
.progreso-escenas{color:var(--tenue);font-size:.9rem}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="barra" id="barra"></header>
<div class="tablero">
  <nav class="mapa" aria-label="Escenas de la hacienda" id="mapa"></nav>
  <main id="escena" tabindex="-1"></main>
  <aside class="libreta" id="libreta" aria-label="Libreta del detective"></aside>
</div>
<dialog id="dialogo"><div id="dialogo-contenido"></div><button class="boton" id="dialogo-cerrar">Cerrar</button></dialog>

<script>
(function(){
'use strict';

/* ---------- Utilidades ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hhmm(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),mi=m%60;return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi;}
function normalizar(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
function leer(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function escribir(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function borrar(k){try{localStorage.removeItem(k);}catch(e){}}

/* ---------- Datos fijos ---------- */
var SOSPECHOSOS=[
 {id:'valeria',nombre:'Valeria Villamizar',corto:'Valeria',rol:'Sobrina y única heredera',desc:'Estudia artes en Bogotá. Llegó hace tres días a pedir un adelanto de la herencia.'},
 {id:'ramiro',nombre:'Ramiro "el Mono" Cárdenas',corto:'Ramiro',rol:'Capataz de la hacienda',desc:'Treinta años cuidando los cafetales. Don Aurelio pensaba reemplazarlo después de la cosecha.'},
 {id:'julian',nombre:'Julián Ferreira',corto:'Julián',rol:'Socio exportador',desc:'Maneja los contratos con Hamburgo. El último contenedor se perdió y alguien tenía que pagarlo.'},
 {id:'ines',nombre:'Inés Tobón',corto:'Inés',rol:'Ama de llaves',desc:'Conoce cada llave y cada secreto de la casa. Nadie sabe cuánto le debe don Aurelio.'},
 {id:'lucas',nombre:'Lucas Rengifo',corto:'Lucas',rol:'Catador de café',desc:'Ganó la Taza de la Excelencia con un perfil de sabor que, según don Aurelio, era suyo.'},
 {id:'santiago',nombre:'Santiago Pombo',corto:'el doctor Pombo',rol:'Médico de la familia',desc:'Firmaba las fórmulas de don Aurelio. Últimamente, demasiadas.'}
];
var CLASES={
 cortante:{causa:'Herida profunda producida con un arma de filo.'},
 contundente:{causa:'Traumatismo en el cráneo por un golpe con un objeto pesado.'},
 veneno:{causa:'Intoxicación aguda. Hay restos de una sustancia tóxica en el estómago.'}
};
var ARMAS=[
 {id:'machete',nombre:'Machete de cosecha',clase:'cortante',sitio:'Vitrina del estudio'},
 {id:'abrecartas',nombre:'Abrecartas de plata',clase:'cortante',sitio:'Escritorio del estudio'},
 {id:'candelabro',nombre:'Candelabro de bronce',clase:'contundente',sitio:'Aparador del comedor'},
 {id:'pilon',nombre:'Pilón de madera',clase:'contundente',sitio:'Cocina'},
 {id:'cianuro',nombre:'Cianuro en el tinto',clase:'veneno',sitio:'Frasco del cuarto de herramientas'},
 {id:'arsenico',nombre:'Arsénico en el aguardiente',clase:'veneno',sitio:'Frasco de la despensa'}
];
var RASTROS={
 tabaco:'Ceniza de tabaco en la ropa de la víctima.',
 cera:'Gotas de cera de vela en los zapatos de la víctima.',
 cascarilla:'Cascarilla de café en el pelo y el cuello de la camisa.'
};
var LUGARES=[
 {id:'estudio',nombre:'Estudio',ala:'oriental',rastro:'tabaco',desc:'Escritorio de nogal, retratos familiares y la caja fuerte. Don Aurelio fumaba tabaco aquí cada noche.'},
 {id:'capilla',nombre:'Capilla',ala:'oriental',rastro:'cera',desc:'Pequeña capilla familiar. Siempre hay velas encendidas frente a la Virgen.'},
 {id:'bodega',nombre:'Bodega de secado',ala:'oriental',rastro:'cascarilla',desc:'Costales de café pergamino apilados hasta el techo. El suelo está cubierto de cascarilla.'},
 {id:'billar',nombre:'Salón de billar',ala:'occidental',rastro:'tabaco',desc:'Mesa de tres bandas. Los invitados fuman tabaco aquí hasta tarde.'},
 {id:'comedor',nombre:'Comedor',ala:'occidental',rastro:'cera',desc:'Mesa para doce personas con candelabros de cera que se encienden en cada cena.'},
 {id:'beneficiadero',nombre:'Beneficiadero',ala:'occidental',rastro:'cascarilla',desc:'Donde se despulpa y se lava el café. La cascarilla vuela por todas partes.'}
];
var ZONAS=[{id:'porteria',nombre:'Portería'}].concat(LUGARES);
var PERSONAL=[
 {log:'Hernán Ospina (vigilante)',cam:'Hernán, el vigilante'},
 {log:'Rosa Quintero (cocinera)',cam:'Rosa, la cocinera'},
 {log:'Wilson Arango (jornalero)',cam:'Wilson, un jornalero'},
 {log:'Deisy Marín (jornalera)',cam:'Deisy, una jornalera'},
 {log:'Yeison Castaño (jornalero)',cam:'Yeison, un jornalero'},
 {log:'Arley Toro (conductor)',cam:'Arley, el conductor'},
 {log:'Marleny Giraldo (aseadora)',cam:'Marleny, la aseadora'}
];
var LOTES=['La Palma','El Guamo','Buenavista','La Cristalina','El Mirador','Los Naranjos','La Ceiba','El Porvenir','Las Brisas','El Recreo'];
var MOTIVOS={
 lucas:'Lucas presentó en la competencia el perfil del lote {lote}. Mi perfil. Lo aplaudieron como si fuera suyo y yo me quedé callado.',
 ramiro:'Le dije a Ramiro que después de la cosecha buscamos otro capataz. No contestó nada. Treinta años y no contestó nada.',
 julian:'Julián jura que el contenedor se perdió por culpa de la aduana en Cartagena. Los de Hamburgo cuentan otra historia.',
 santiago:'El doctor Pombo me subió la dosis otra vez. No confío en esas pastillas; las estoy botando por el sifón.',
 ines:'Inés encontró las cartas de mi hermano en el baúl. Me miró como si supiera algo que yo no sé.',
 valeria:'Llegó Valeria. Quiere el adelanto de la herencia. Le dije que el lunes voy a la notaría y que ahí se enterará de todo.'
};
var FECHAS_MOTIVO=['Martes 1 de septiembre','Viernes 4 de septiembre','Jueves 10 de septiembre','Lunes 14 de septiembre','Sábado 19 de septiembre','Miércoles 23 de septiembre'];
var ORDEN_MOTIVO=['lucas','ramiro','julian','santiago','ines','valeria'];

function conArticulo(l){return ((l.id==='capilla'||l.id==='bodega')?'la ':'el ')+l.nombre.charAt(0).toLowerCase()+l.nombre.slice(1);}

/* ---------- Generador del caso ---------- */
function generarCaso(num){
  var r=mulberry32(num*9973+17);
  function ri(a,b){return a+Math.floor(r()*(b-a+1));}
  function pick(arr){return arr[Math.floor(r()*arr.length)];}
  function mezclar(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function byId(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];}

  var asesino=pick(SOSPECHOSOS), arma=pick(ARMAS), lugar=pick(LUGARES);
  var T=1260+10*ri(0,14); // entre 21:00 y 23:20
  var fin=T+40;
  var inocentes=mezclar(SOSPECHOSOS.filter(function(s){return s!==asesino;}));
  var conCoartada=inocentes.slice(0,3), llamador=inocentes[3], viajero=inocentes[4];
  var otrosLugares=LUGARES.filter(function(l){return l!==lugar;});

  // Inventario: falta el arma real y una de cada otra clase
  var faltantes=[arma.id];
  Object.keys(CLASES).forEach(function(c){ if(c!==arma.clase){ faltantes.push(pick(ARMAS.filter(function(a){return a.clase===c;})).id); } });

  // Registro de accesos
  var ev=[];
  function add(t,persona,zona,tipo){ if(t<=1530) ev.push({t:t,persona:persona,zona:zona,tipo:tipo}); }
  var detalle={};
  SOSPECHOSOS.forEach(function(s){
    if(s===viajero) return;
    if(s===llamador){
      add(ri(1080,1100),s.nombre,'porteria','Entrada');
      var sale=ri(1140,1160); add(sale,s.nombre,'porteria','Salida');
      var vuelve=fin+ri(60,90); add(vuelve,s.nombre,'porteria','Entrada');

    }
    add(ri(1080,1150),s.nombre,'porteria','Entrada');
    var dIn=ri(1165,1180), dOut=ri(1220,1245);
    add(dIn,s.nombre,'comedor','Entrada'); add(dOut,s.nombre,'comedor','Salida');
    if(conCoartada.indexOf(s)>=0){
      var z=pick(otrosLugares);
      var a=Math.max(dOut+ri(3,10),T-ri(15,50)), b=fin+ri(10,45);

      if(r()<.6){ var z2=pick(otrosLugares.filter(function(x){return x!==z;})); var c=b+ri(5,20); add(c,s.nombre,z2.id,'Entrada'); add(c+ri(15,40),s.nombre,z2.id,'Salida'); }
    } else if(s===asesino){
      var zk=pick(otrosLugares);
      var ka=dOut+ri(3,8), kb=T+ri(5,15);
      add(ka,s.nombre,zk.id,'Entrada'); add(kb,s.nombre,zk.id,'Salida');
      var z3=pick(otrosLugares); var kc=T+ri(55,70);
      add(kc,s.nombre,z3.id,'Entrada'); add(kc+ri(20,40),s.nombre,z3.id,'Salida');
      detalle[s.id]={zona:zk,a:ka,b:kb};
    }
  });
  add(ri(1166,1172),'Aurelio Villamizar','comedor','Entrada');
  add(ri(1236,1248),'Aurelio Villamizar','comedor','Salida');
  PERSONAL.forEach(function(p){
    var cur=1080+ri(0,30);
    while(cur<1480){
      var z=pick(ZONAS), dur=ri(8,45), e=cur+dur;
      var choca=(z.id===lugar.id && cur<fin+15 && e>T-15);
      if(!choca){ add(cur,p.log,z.id,'Entrada'); add(e,p.log,z.id,'Salida'); }
      cur=e+ri(10,50);
    }
  });
  ev.sort(function(x,y){return x.t-y.t || (x.persona<y.persona?-1:1);});

  // Cámara del corredor
  var frames=[];
  for(var t=1140;t<=1500;t+=10){
    var d;

    else if(t>=T-5 && t<=fin) d='Sin movimiento en el corredor.';
    else if(r()<.5) d='Sin movimiento en el corredor.';
    else { var p=pick(PERSONAL); d=p.cam.charAt(0).toUpperCase()+p.cam.slice(1)+' cruza hacia el ala '+pick(['oriental','occidental'])+pick([' con una bandeja',' con una linterna',' hablando por radio',' con costales vacíos',' a paso rápido',''])+'.'; }
    frames.push({t:hhmm(t),d:d});
  }

  // Contestadora
  var k=detalle[asesino.id];
  var c0=conCoartada[0], d0=detalle[c0.id];
  var msgs=[
    {t:1120,origen:'Exportadora Hanse Kaffee, Hamburgo',texto:'Buenas noches, don Aurelio, le habla Klaus Weber. El contenedor sigue retenido en Cartagena. Si el lunes no llega el pago, cancelamos el contrato con el señor Ferreira.'},
    {t:1192,origen:'Notaría Segunda de Armenia',texto:'Don Aurelio, le confirmamos que el cambio al testamento queda listo para firmar el lunes a las nueve de la mañana.'},
    {t:ri(k.a+2,T-5),origen:'Celular de '+asesino.nombre,texto:'Don Aurelio, habla '+asesino.corto+'. Estoy en '+conArticulo(k.zona)+'. Cuando termine lo busco; tenemos una conversación pendiente.'},
    {t:T+ri(8,32),origen:'Teléfono público, panadería La Espiga, plaza de Salento',texto:'Don Aurelio, le habla '+llamador.nombre+'. Estoy en el pueblo, se me varó el carro y no alcanzo a subir antes de la medianoche. Mañana temprano hablamos.'},
    {t:d0.b-ri(3,8),origen:'Extensión interna, '+d0.zona.nombre,texto:'¿Don Aurelio? Soy '+c0.corto+'. Lo estuve esperando toda la noche. Ya me voy a acostar.'},
    {t:fin+12,origen:'Número desconocido',texto:'(Nadie habla. Se oye un aguacero fuerte y cuelgan.)'}
  ];
  msgs.forEach(function(m){ m.h=hhmm(m.t); });
  msgs.sort(function(a,b){return a.t-b.t;});

  // Estudio: retratos y clave de la caja
  var anio=ri(1895,1938);

  function otroAnio(a,b){var y;do{y=ri(a,b);}while(usados.indexOf(y)>=0);usados.push(y);return y;}
  var retratos=mezclar([
    {ini:'EV',placa:'Don Evaristo Villamizar',tip:'Don Evaristo, el fundador. Compró estas tierras en '+anio+' con lo que ganó arriando mulas.'},
    {ini:'MR',placa:'Doña Mercedes Restrepo',tip:'Madre de don Aurelio. Nació en '+otroAnio(1895,1935)+' en Filandia.'},

    {ini:'RV',placa:'Rafael Villamizar',tip:'Tío abuelo de don Aurelio. Compró su primera mula en '+otroAnio(1880,1899)+'.'}
  ]);
  var lote=pick(LOTES);

  var paginas=ORDEN_MOTIVO.map(function(id,i){return {fecha:FECHAS_MOTIVO[i],texto:MOTIVOS[id].replace('{lote}',lote)};});
  var sospechoso7=pick(inocentes.filter(function(s){return s!==viajero;}));
  paginas.push({fecha:'Viernes 25 de septiembre',texto:'Anoche alguien revolvió los papeles del estudio. No quiero pensar mal, pero '+sospechoso7.corto+' estuvo rondando por aquí toda la tarde.'});
  paginas.push({fecha:'Sábado 26 de septiembre',texto:viajero.nombre+' salió esta madrugada para Manizales, a la feria, y no vuelve hasta el lunes. Mejor así. Esta noche hablo con todos los demás, uno por uno.'});

  return {num:num,asesino:asesino,arma:arma,lugar:lugar,T:T,fin:fin,conCoartada:conCoartada,llamador:llamador,viajero:viajero,
    detalle:detalle,faltantes:faltantes,eventos:ev,frames:frames,mensajes:msgs,anio:anio,retratos:retratos,lote:lote,falso:falso,paginas:paginas,
    placa:'FGN-'+(1000+((num*7919)%9000))};
}

     '<form id="form-diario" novalidate><div class="campo" style="max-width:360px"><label for="clave-diario">Clave del candado</label><input id="clave-diario" autocomplete="off"></div>'+
     '<p class="error" id="error-diario" role="alert"></p><button class="boton" type="submit">Abrir diario</button></form>';
  }
  var p=caso.paginas[paginaDiario];
  return titulo('Diario de don Aurelio','Las últimas páginas del mes, escritas a mano.')+
   '<article class="pagina-diario" id="pagina-diario"><span class="fecha">'+p.fecha+'</span>'+esc(p.texto)+'</article>'+
   '<div class="paginador"><button class="boton secundario" type="button" id="pag-ant"'+(paginaDiario===0?' disabled':'')+'>Página anterior</button>'+
   '<span id="num-pagina">Página '+(paginaDiario+1)+' de '+caso.paginas.length+'</span>'+
   '<button class="boton secundario" type="button" id="pag-sig"'+(paginaDiario===caso.paginas.length-1?' disabled':'')+'>Página siguiente</button></div>';
},
acusacion:function(){
  var html=titulo('Acusación','Señala al culpable, el arma y el lugar donde murió don Aurelio. Solo se acepta la acusación si las tres respuestas son correctas.');
  if(estado.resultado) return html+veredicto();
  function sel(id,label,arr){return '<div class="campo"><label for="'+id+'">'+label+'</label><select id="'+id+'"><option value="">Elige…</option>'+arr.map(function(x){return '<option value="'+x.id+'">'+esc(x.nombre)+'</option>';}).join('')+'</select></div>';}
  return html+'<form id="form-acusacion" novalidate><div class="acusacion">'+sel('acusa-quien','Quién',SOSPECHOSOS)+sel('acusa-arma','Con qué arma',ARMAS)+sel('acusa-lugar','En qué lugar',LUGARES)+'</div>'+
   '<p class="error" id="error-acusacion" role="alert"></p><p>Acusaciones disponibles: <strong id="intentos">'+estado.intentos+'</strong></p>'+
   '<button class="boton" type="submit">Acusar</button></form>';
}
};

function explicacion(){
  var c=caso, par=ARMAS.filter(function(a){return a.clase===c.arma.clase;});
  var otraAla=LUGARES.filter(function(l){return l.ala===c.lugar.ala;}).map(function(l){return l.nombre;}).join(', ');
  var mismos=LUGARES.filter(function(l){return l.rastro===c.lugar.rastro;}).map(function(l){return l.nombre;}).join(' y ');
  var items=[];
  items.push('<li><strong>La hora.</strong> El laboratorio fijó la muerte entre las '+hhmm(c.T)+' y las '+hhmm(c.fin)+'. Todas las coartadas se miden contra esa ventana.</li>');
  items.push('<li><strong>El arma.</strong> La causa de muerte deja solo '+par[0].nombre+' o '+par[1].nombre+'. En el inventario de la caja fuerte falta únicamente '+c.arma.nombre+'.</li>');
  items.push('<li><strong>El lugar.</strong> La cámara muestra a don Aurelio yendo al ala '+c.lugar.ala+' ('+otraAla+'). El rastro del cuerpo apunta a '+mismos+'. Solo '+c.lugar.nombre+' cumple ambas cosas.</li>');
  c.conCoartada.forEach(function(s){var d=c.detalle[s.id];items.push('<li><strong>'+esc(s.nombre)+'</strong> estuvo en '+d.zona.nombre+' de '+hhmm(d.a)+' a '+hhmm(d.b)+', toda la ventana. Tiene coartada.</li>');});
  var ll=c.mensajes.filter(function(m){return m.origen.indexOf('Salento')>=0;})[0];
  items.push('<li><strong>'+esc(c.llamador.nombre)+'</strong> llamó desde Salento a las '+ll.h+'. A cincuenta minutos de distancia, no pudo estar en la hacienda durante el crimen.</li>');
  items.push('<li><strong>'+esc(c.viajero.nombre)+'</strong> se fue a Manizales esa madrugada, según el diario, y no aparece en el registro.</li>');
  var k=c.detalle[c.asesino.id];
  items.push('<li><strong>'+esc(c.asesino.nombre)+'</strong> salió de '+k.zona.nombre+' a las '+hhmm(k.b)+', en plena ventana, y no vuelve a aparecer en ningún lector hasta después del crimen. No tiene coartada.</li>');
  items.push('<li><strong>La trampa.</strong> La confesión escondida en el estudio, firmada por '+esc(c.falso.nombre)+', era falsa: nunca estuvo a la vista.</li>');
  return '<h3 style="margin-top:1.5rem;font-size:1.5rem">Cómo se resolvía</h3><ol>'+items.join('')+'</ol>';
}
function veredicto(){
  var gano=estado.resultado==='resuelto';
  return '<section class="veredicto '+(gano?'gano':'perdio')+'" id="veredicto"><p role="status" class="grande" id="estado-caso">'+(gano?'Caso resuelto ✅':'Caso cerrado sin culpable')+'</p>'+
   '<p>'+(gano?'Detuviste a ':'El asesino era ')+esc(caso.asesino.nombre)+'. Usó '+caso.arma.nombre.charAt(0).toLowerCase()+caso.arma.nombre.slice(1)+' en '+conArticulo(caso.lugar)+'.</p>'+
   '<div class="resumen"><div><strong id="tiempo-final">'+tiempo()+'</strong>Tiempo total</div><div><strong>'+(2-estado.intentos)+'</strong>Acusaciones usadas</div><div><strong>'+estado.vistas.length+' de '+INVESTIGABLES+'</strong>Escenas revisadas</div></div>'+
   explicacion()+'</section>';
}

/* ---------- Pintado y eventos ---------- */
function pintar(){
  pintarBarra(); pintarMapa(); pintarLibreta();
  var id=estado.logueado?estado.escena:'porteria';
  if(estado.logueado && id==='porteria') id=estado.escena='expediente';
  document.getElementById('escena').innerHTML=render[id]();
  if(id==='camara') montarCamara();
}

function montarCamara(){
  var f=document.getElementById('monitor');
  var datos=JSON.stringify(caso.frames);
  f.srcdoc='<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><style>'+
   'body{margin:0;background:#050805;color:#9CFFB0;font-family:"Courier New",monospace;height:100vh;display:flex;flex-direction:column}'+
   '.pantalla{flex:1;position:relative;padding:18px 22px;background:radial-gradient(ellipse at center,#0d1f12 0%,#030603 80%);overflow:hidden}'+
   '.pantalla::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 4px);pointer-events:none}'+
   '.rec{color:#ff5a5a;font-weight:700;font-size:14px}.hora{font-size:44px;margin:14px 0 18px;letter-spacing:.06em}'+
   '#desc{font-size:19px;line-height:1.5;max-width:560px}'+
   '.controles{display:flex;gap:8px;padding:10px;background:#111;flex-wrap:wrap}'+
   'button,select{font:inherit;background:#1f2a22;color:#cfe;border:1px solid #395;padding:6px 12px;cursor:pointer}'+
   'button:focus-visible,select:focus-visible{outline:2px solid #9CFFB0}'+
   '</style></head><body><div class="pantalla"><div class="rec">● REC  CAM-01  CORREDOR CENTRAL</div>'+
   '<div class="hora" id="hora"></div><p id="desc" aria-live="polite"></p></div>'+
   '<div class="controles"><button id="prev" type="button">Imagen anterior</button>'+
   '<label for="salto" style="align-self:center;color:#8a9">Ir a</label><select id="salto"></select>'+
   '<button id="next" type="button">Imagen siguiente</button></div>'+
   '<script>var F='+datos+';var i=0;var s=document.getElementById("salto");'+
   'F.forEach(function(f,k){var o=document.createElement("option");o.value=k;o.textContent=f.t;s.appendChild(o);});'+
   'function show(){document.getElementById("hora").textContent=F[i].t;document.getElementById("desc").textContent=F[i].d;s.value=i;'+
   'document.getElementById("prev").disabled=i===0;document.getElementById("next").disabled=i===F.length-1;}'+
   'document.getElementById("prev").onclick=function(){if(i>0){i--;show();}};'+

function abrirDialogo(html){
  var d=document.getElementById('dialogo');
  document.getElementById('dialogo-contenido').innerHTML=html;
  if(d.showModal) d.showModal(); else d.setAttribute('open','');
}
document.getElementById('dialogo-cerrar').addEventListener('click',function(){var d=document.getElementById('dialogo');if(d.close)d.close();else d.removeAttribute('open');});

function htmlCarta(){
  return '<h3 style="font-family:var(--display,Georgia);font-size:1.5rem">Para quien abra esta caja</h3>'+
   '<p style="font-style:italic">Si está leyendo esto es porque alguien abrió la caja y yo ya no puedo contarlo.</p>'+
   '<p>Esta semana todos me sonríen demasiado. El lunes cambio el testamento y eso no le va a gustar a nadie en esta casa.</p>'+
   '<p>Lo que no me atreví a decir en voz alta lo dejé en mi diario. El candado se abre con el nombre del lote donde sembré mi primer café: '+caso.lote+'.</p>'+
   '<p>Y no se fíe de papeles escondidos. Aquí cualquiera escribe lo que quiere.</p><p>— Aurelio Villamizar</p>';
}
function abrirCarta(){
  var w=null;
  try{ w=window.open('','carta-aurelio','width=560,height=640'); }catch(e){ w=null; }
  if(w && w.document){
    try{
      w.document.write('<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Carta de don Aurelio</title><style>body{font-family:Georgia,serif;background:#efe9d6;color:#2a2418;padding:2rem;line-height:1.6;max-width:36rem;margin:auto}h3{font-size:1.5rem}</style></head><body>'+htmlCarta()+'</body></html>');
      w.document.close(); return;
    }catch(e){}
  }
  abrirDialogo(htmlCarta());
}

function pedirAnalisis(){
  var btn=document.getElementById('pedir-analisis'); btn.disabled=true;
  var caja=document.getElementById('analisis'); caja.hidden=false;
  var dur=5000+Math.random()*4000, t0=Date.now();
  var barra=document.getElementById('relleno'), pb=caja.querySelector('[role=progressbar]');
  var iv=setInterval(function(){
    var p=Math.min(100,Math.round((Date.now()-t0)/dur*100));
    if(barra) barra.style.width=p+'%'; if(pb) pb.setAttribute('aria-valuenow',p);
    if(p>=100){ clearInterval(iv); estado.forense=true; guardar(); if(estado.escena==='forense') pintar(); }
  },200);
}

function mostrarTooltip(btn){
  quitarTooltips();
  var p=caso.retratos[+btn.getAttribute('data-retrato')];
  var t=document.createElement('span'); t.className='tooltip'; t.setAttribute('role','tooltip'); t.id='tip-retrato';
  t.textContent=p.tip; btn.appendChild(t); btn.setAttribute('aria-describedby','tip-retrato');
}
function quitarTooltips(){document.querySelectorAll('.tooltip').forEach(function(t){var b=t.parentNode;b.removeAttribute('aria-describedby');t.remove();});}

document.addEventListener('mouseover',function(e){var b=e.target.closest&&e.target.closest('[data-retrato]');if(b&&!b.querySelector('.tooltip'))mostrarTooltip(b);});
document.addEventListener('mouseout',function(e){var b=e.target.closest&&e.target.closest('[data-retrato]');if(b&&!b.contains(e.relatedTarget))quitarTooltips();});
document.addEventListener('focusin',function(e){var b=e.target.closest&&e.target.closest('[data-retrato]');if(b)mostrarTooltip(b);});
document.addEventListener('focusout',function(e){if(e.target.closest&&e.target.closest('[data-retrato]'))quitarTooltips();});

document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('button'):null; if(!t) return;
  if(t.hasAttribute('data-ir')) return ir(t.getAttribute('data-ir'));
  if(t.hasAttribute('data-marca')){ var k=t.getAttribute('data-marca'); estado.marcas[k]=!estado.marcas[k]; guardar(); t.setAttribute('aria-pressed',!!estado.marcas[k]); return; }
  if(t.hasAttribute('data-digito')){ if(codigo.length<4){codigo+=t.getAttribute('data-digito');} document.getElementById('pantalla-caja').textContent=codigo.replace(/./g,'•'); return; }
  if(t.hasAttribute('data-borrar')){ codigo=''; document.getElementById('pantalla-caja').innerHTML='&nbsp;'; return; }
  if(t.hasAttribute('data-mensaje')){ var m=caso.mensajes[+t.getAttribute('data-mensaje')]; abrirDialogo('<p><strong>'+m.h+'</strong></p><p>'+esc(m.origen)+'</p><p style="font-style:italic;font-size:1.1rem">«'+esc(m.texto)+'»</p>'); return; }
  switch(t.id){
    case 'abrir-otro': var n=parseInt(document.getElementById('otro-caso').value,10); if(n>0){abrirCaso(n);pintar();} return;
    case 'mas-registros': reg.mostrar+=20; pintar(); return;
    case 'pedir-analisis': pedirAnalisis(); return;
    case 'abrir-carta': abrirCarta(); return;
    case 'pag-ant': if(paginaDiario>0){paginaDiario--;pintar();} return;
    case 'pag-sig': if(paginaDiario<caso.paginas.length-1){paginaDiario++;pintar();} return;
    case 'abrir-caja':
      if(codigo===String(caso.anio)){ estado.caja=true; estado.cajaFallos=0; codigo=''; guardar(); pintar(); }
      else{
        codigo=''; estado.cajaFallos++;
        var msg='Combinación incorrecta.';
        if(estado.cajaFallos>=3){ estado.bloqueo=Date.now()+20000; estado.cajaFallos=0; msg='Tres intentos fallidos. La caja se bloqueó por veinte segundos.'; guardar(); pintar(); document.getElementById('error-caja').textContent=msg; setTimeout(function(){ if(estado.escena==='caja') pintar(); },20100); return; }
        guardar(); document.getElementById('pantalla-caja').innerHTML='&nbsp;'; document.getElementById('error-caja').textContent=msg;
      }
      return;
    case 'reiniciar': if(confirmar('¿Reiniciar este caso? Se borran el tiempo, las notas y las acusaciones.')){ borrar('esmeralda:'+caso.num); estado=estadoNuevo(); codigo=''; paginaDiario=0; reg={persona:'',zona:'',mostrar:20}; pintar(); } return;
    case 'nuevo': abrirCaso(1000+Math.floor(Math.random()*9000)); codigo=''; paginaDiario=0; reg={persona:'',zona:'',mostrar:20}; pintar(); return;
  }
});
function confirmar(txt){ try{ return window.confirm(txt); }catch(e){ return true; } }

document.addEventListener('change',function(e){
  if(e.target.id==='f-persona'){ reg.persona=e.target.value; reg.mostrar=20; pintar(); document.getElementById('f-persona').focus(); }
  if(e.target.id==='f-zona'){ reg.zona=e.target.value; reg.mostrar=20; pintar(); document.getElementById('f-zona').focus(); }
});
document.addEventListener('input',function(e){ if(e.target.id==='notas'){ estado.notas=e.target.value; guardar(); } });

document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target;
  if(f.id==='form-ingreso'){
    var nombre=document.getElementById('detective').value.trim();
    var placa=document.getElementById('placa').value.trim().toUpperCase();
    var err=document.getElementById('error-ingreso');
    if(!nombre){ err.textContent='Escribe tu nombre para entrar.'; return; }
    if(placa!==caso.placa){ err.textContent='El número de placa no coincide con la orden de la Fiscalía.'; return; }
    estado.logueado=true; estado.detective=nombre; estado.inicio=estado.inicio||Date.now(); guardar(); ir('expediente');
  }
  if(f.id==='form-diario'){
    var v=normalizar(document.getElementById('clave-diario').value);
    if(v===normalizar(caso.lote)||v===normalizar('lote '+caso.lote)){ estado.diario=true; guardar(); paginaDiario=0; pintar(); }
    else document.getElementById('error-diario').textContent='El candado no abre con esa palabra.';
  }
  if(f.id==='form-acusacion'){
    var q=document.getElementById('acusa-quien').value, a=document.getElementById('acusa-arma').value, l=document.getElementById('acusa-lugar').value;
    var er=document.getElementById('error-acusacion');
    if(!q||!a||!l){ er.textContent='Elige un sospechoso, un arma y un lugar.'; return; }
    if(q===caso.asesino.id && a===caso.arma.id && l===caso.lugar.id){ estado.resultado='resuelto'; estado.fin=Date.now(); guardar(); pintar(); return; }
    estado.intentos--;
    if(estado.intentos<=0){ estado.resultado='fallido'; estado.fin=Date.now(); guardar(); pintar(); return; }
    guardar(); pintarLibreta();
    document.getElementById('intentos').textContent=estado.intentos;
    er.textContent='La acusación no se sostiene. Al menos una de las tres respuestas es incorrecta. Te queda '+estado.intentos+' acusación.';
  }
});

setInterval(function(){ var r=document.getElementById('reloj'); if(r) r.textContent='Tiempo '+tiempo(); },1000);

abrirCaso(numeroInicial());
pintar();
})();
</script>
